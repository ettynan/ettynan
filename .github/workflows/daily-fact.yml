
name: Daily Fact Update

concurrency:
  group: daily-fact-update
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at noon UTC
  workflow_dispatch:       # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Pull latest changes
        run: git pull --ff-only origin main

      - name: Fetch a random fact
        id: fact
        shell: bash
        run: |
          set -euo pipefail
      
          FETCHED_FACT=""
      
          echo "Trying Drivebird..."
      
          if RESPONSE=$(curl -fsS --retry 2 --retry-delay 3 \
            --max-time 15 \
            "https://www.drivebird.com/api/facts/random"); then
      
            FETCHED_FACT=$(printf '%s' "$RESPONSE" | python3 -c '
          import sys, json
          try:
              fact = json.load(sys.stdin)["data"][0]["fact"]
              if isinstance(fact, str) and fact.strip():
                  print(fact.strip())
          except (ValueError, KeyError, IndexError, TypeError):
              pass
          ')
          fi
      
          if [ -z "$FETCHED_FACT" ]; then
            echo "Drivebird failed. Trying Useless Facts API..."
      
            RESPONSE=$(curl -fsS --retry 2 --retry-delay 3 \
              --max-time 15 \
              "https://uselessfacts.jsph.pl/api/v2/facts/random?language=en")
      
            FETCHED_FACT=$(printf '%s' "$RESPONSE" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          fact = data["text"]
          if not isinstance(fact, str) or not fact.strip():
              raise ValueError("Invalid backup fact")
          print(fact.strip())
          ')
      
            echo "Backup API succeeded."
          else
            echo "Drivebird succeeded."
          fi
      
          {
            echo 'fact<<EOF'
            echo "$FETCHED_FACT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update README with fact
        run: |
          FACT="${{ steps.fact.outputs.fact }}"
          DATE=$(date +"%B %d, %Y")

          export FACT
          export DATE

          python3 scripts/update_fact.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'ettynan'
          git config --global user.email '${{ secrets.GIT_EMAIL }}'

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update daily fact"
          git push origin main
